# Global runtime configuration
llm:
  provider: openrouter
  base_url: "https://openrouter.ai/api/v1"
  model: "openai/gpt-4o"
  max_tokens: 4096
  temperature: 0.2
  max_self_correction_rounds: 3
  max_agent_steps: 14

accessibility:
  mode: walking
  mobility_scenario: walking
  mode_speeds_kmh:
    walking: 4.8
    cycling: 15.0
    driving: 35.0
  mode_detour_factors:
    walking: 1.3
    cycling: 1.2
    driving: 1.25
  ors_upper_speeds_kmh:
    walking: 6.0
    cycling: 25.0
    driving: 80.0
  speed_kmh: 4.8
  threshold_minutes: 15
  router: ors
  ors_city_only: false
  ors_max_area_km2: 15000
  ors_max_eligible_pairs: 250000
  detour_factor: 1.3
  ors_base_url: "https://api.heigit.org/openrouteservice/v2/matrix"
  ors_upper_speed_kmh: 6.0
  ors_max_policy_threshold_minutes: 20
  ors_pruning_margin: 1.5
  ors_tile_size_m: 3000
  ors_source_chunk_size: 35
  ors_destination_chunk_size: 50
  ors_max_routes_per_request: 3500
  ors_target_routes_per_request: 1750
  ors_max_inflight_routes: 3500
  ors_max_concurrency: 2
  ors_cache_version: v2
  ors_matrix_ttl_days: 30
  ors_cache_max_gb: 2
  ors_max_requests: 500
  ors_request_interval_s: 1.6
  ors_timeout_s: 60

optimization:
  value_profile: balanced
  n_facilities: 8
  solver_time_limit_s: 120
  pareto_workers: 4

data:
  io_workers: 4
  landsat_probe_workers: 8
  dask_workers: 4

execution:
  default_mode: auto

output:
  dir: outputs_run
