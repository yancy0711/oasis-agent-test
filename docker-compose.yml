services:
  backend:
    build: .
    image: oasis-agent:local
    init: true
    env_file: .env
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "8000:8000"
    volumes:
      - ./data/cache:/app/data/cache
      - ./outputs_run:/app/outputs_run
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build: .
    image: oasis-agent:local
    init: true
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      OASIS_API_URL: http://backend:8000/v1
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
