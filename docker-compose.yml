services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: oasis-agent:local
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      OASIS_CONFIG_PATH: /app/config/settings.yaml
      OASIS_CACHE_DIR: /app/data/cache
      OASIS_OUTPUT_DIR: /app/outputs_run
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "8000:8000"
    volumes:
      - ./data/cache:/app/data/cache
      - ./outputs_run:/app/outputs_run
      - ./tmp/uploads:/app/tmp/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: oasis-frontend:local
    init: true
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
