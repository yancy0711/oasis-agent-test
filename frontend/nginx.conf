# Docker changes a service's IP when its container is recreated. Resolve the
# service name at runtime instead of retaining the address from Nginx startup.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;
upstream oasis_backend {
    zone oasis_backend 64k;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://oasis_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_intercept_errors on;
        error_page 502 504 = @backend_unavailable;
        # Resident searches allow 115s; leave the browser's 125s deadline in charge.
        proxy_read_timeout 130s;
    }

    location @backend_unavailable {
        default_type application/json;
        add_header Retry-After 5 always;
        return 503 '{"detail":"OASIS backend is temporarily unreachable. Your saved data is kept. Retry shortly; if this persists, check Docker service health."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
